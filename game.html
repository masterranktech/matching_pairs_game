<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FontAwesome Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="container">
        <div class="detail">
            <div>
                <p>Clicks: <span class="clicks">0</span></p>
                <p>Incorrect: <span class="incorrect">0</span></p>
            </div>
            <div>
                <p class="time">your time: <span class="min">0</span>: <span class="sec">0</span></p>
            </div>
            <div>
                <p>Effort: <span class="effort">3</span>/3</p>
                <button class="help">Help</button>
            </div>
        </div>
        <ul>
            <li><i class="fas fa-biking"></i></li>
            <li><i class="fas fa-biking"></i></li>
            <li><i class="fas fa-bomb"></i></li>
            <li><i class="fas fa-bomb"></i></li>
            <li><i class="fas fa-candy-cane"></i></li>
            <li><i class="fas fa-candy-cane"></i></li>
            <li><i class="fas fa-cat"></i></li>
            <li><i class="fas fa-cat"></i></li>
            <li><i class="fas fa-child"></i></li>
            <li><i class="fas fa-child"></i></li>
            <li><i class="fas fa-crow"></i></li>
            <li><i class="fas fa-crow"></i></li>
            <li><i class="fas fa-crown"></i></li>
            <li><i class="fas fa-crown"></i></li>
            <li><i class="fas fa-dragon"></i></li>
            <li><i class="fas fa-dragon"></i></li>
        </ul>
        <div class="winner-container">
            <div class="winner-box">
                <h1>Congratulations</h1>
                <hr>
                <div>
                    <span>Time</span>
                    <span id="time"></span>
                </div>
                <hr>
                <div>
                    <span>Clicks</span>
                    <span id="click-end"></span>
                </div>
                <hr>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
